<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据监控 · 执行数据（分流 + 架构兼容）</title>
<style>
  :root{
    /* 线上实测 design token */
    --brand:#24CDA5; --brand-deep:#0E9E8A; --brand-tint:#E6F7F4;
    --page-fill:#F2F4F7; --surface:#FFFFFF;
    --foreground:#1C1C23; --secondary:rgba(28,28,35,.6); --muted:rgba(28,28,35,.45);
    --border:#EAECF0; --border-strong:rgba(45,66,107,.12);
    --th-fill:#F5F7FA;
    --success:#12B76A; --danger:#F04438;
    --radius-card:12px; --radius-md:8px; --radius-sm:6px; --radius-pill:24px;
    --sh-card:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    /* 两条架构支路的区分色 */
    --arch-a:#0E9E8A; --arch-a-tint:#E6F7F4;      /* 多智能体：品牌绿 */
    --arch-b:#3E8EF7; --arch-b-tint:#EAF1FE;      /* Agent+Skill：蓝 */
    /* 阶段/技能配色 */
    --s1:#0E9E8A; --s2:#24CDA5; --s3:#4FD3B4; --s4:#7FE0CB; --s5:#A9EBDD; --s6:#0B7D6D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--page-fill);color:var(--foreground);
    font-family:-apple-system,"system-ui","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
    line-height:1.5;font-size:14px;
  }

  /* ---------- 应用外壳 ---------- */
  .app{display:flex;min-height:100vh;}
  .rail{width:56px;flex:none;background:#0F1B2D;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:20px;}
  .rail .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#0E9E8A);}
  .rail .ri{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8B97A8;font-size:16px;cursor:pointer;}
  .rail .ri.on{background:rgba(36,205,165,.16);color:var(--brand);}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topnav{height:52px;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:4px;padding:0 20px;position:sticky;top:0;z-index:20;}
  .topnav .nav-item{padding:0 14px;height:52px;display:flex;align-items:center;color:var(--secondary);
    font-size:14px;cursor:pointer;position:relative;font-weight:500;}
  .topnav .nav-item.on{color:var(--foreground);font-weight:600;}
  .topnav .nav-item.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--brand);border-radius:2px;}
  .topnav .grow{flex:1;}
  .topnav .tag{font-size:12px;background:var(--brand-tint);color:var(--brand-deep);
    padding:3px 10px;border-radius:var(--radius-pill);font-weight:600;}

  .page{padding:20px 24px 40px;max-width:1320px;width:100%;margin:0 auto;}
  .page-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;margin-bottom:16px;}
  .page-title .bot{width:28px;height:28px;border-radius:8px;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;font-size:16px;}

  /* ---------- 分段胶囊控件 ---------- */
  .seg{display:inline-flex;background:#F2F4F7;border-radius:var(--radius-pill);padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;color:var(--secondary);font-size:14px;font-weight:500;
    padding:5px 22px;border-radius:var(--radius-pill);cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap;}
  .seg button:hover{color:var(--foreground);}
  .seg button.on{background:var(--brand-tint);color:var(--brand-deep);font-weight:600;}

  /* ---------- 卡片 ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
    box-shadow:var(--sh-card);padding:20px;margin-bottom:16px;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .sec-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;color:var(--foreground);}
  .sec-title .bar{width:3px;height:16px;background:var(--brand);border-radius:2px;display:inline-block;}
  .sec-sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px;}
  .group-label{font-size:12px;color:var(--secondary);font-weight:600;margin:2px 0 10px;display:flex;align-items:center;gap:6px;}
  .group-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);}

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .kpi-grid.four{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.kpi-grid.four{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.kpi-grid,.kpi-grid.four{grid-template-columns:1fr}}
  .kpi{border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;background:linear-gradient(180deg,#FBFEFD,#fff);}
  .kpi .kl{font-size:13px;color:var(--secondary);}
  .kpi .kv{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;}
  .kpi .kv b{font-size:28px;font-weight:700;letter-spacing:-.5px;}
  .kpi .kd{font-size:13px;font-weight:600;}
  .kpi .prog{height:8px;border-radius:6px;background:#EEF1F4;overflow:hidden;}
  .kpi .prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand-deep),var(--brand));}
  .up{color:var(--success);} .down{color:var(--danger);} .flat{color:var(--muted);}

  /* ---------- 趋势图 ---------- */
  .trend svg{width:100%;height:auto;display:block;}
  .trend-legend{display:flex;gap:16px;align-items:center;margin-top:6px;font-size:12px;color:var(--secondary);}
  .trend-legend .sw{width:14px;height:4px;border-radius:2px;background:var(--brand);display:inline-block;}

  /* ---------- 执行数据：分流 ---------- */
  .split-total{display:flex;flex-direction:column;align-items:center;margin-bottom:2px;}
  .split-total .tnode{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
    background:#0F1B2D;color:#fff;border-radius:var(--radius-md);padding:12px 28px;min-width:220px;text-align:center;}
  .split-total .tnode .tl{font-size:12px;opacity:.75;}
  .split-total .tnode .tv{font-size:24px;font-weight:700;letter-spacing:-.3px;}
  .split-total .tnode .ts{font-size:11px;opacity:.7;}
  .split-connector{width:100%;height:34px;}
  .split-lanes{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:820px){.split-lanes{grid-template-columns:1fr}}
  .lane{border:1px solid var(--border);border-top-width:3px;border-radius:var(--radius-md);padding:16px;background:#fff;}
  .lane.a{border-top-color:var(--arch-a);}
  .lane.b{border-top-color:var(--arch-b);}
  .lane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .lane-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
  .lane-name .dot{width:10px;height:10px;border-radius:3px;}
  .lane.a .dot{background:var(--arch-a);} .lane.b .dot{background:var(--arch-b);}
  .lane-share{display:flex;align-items:baseline;gap:8px;}
  .lane-share b{font-size:20px;font-weight:700;letter-spacing:-.3px;}
  .lane-pct{font-size:12px;font-weight:600;border-radius:var(--radius-pill);padding:2px 10px;}
  .lane.a .lane-pct{background:var(--arch-a-tint);color:var(--arch-a);}
  .lane.b .lane-pct{background:var(--arch-b-tint);color:var(--arch-b);}
  .lane-desc{font-size:12px;color:var(--muted);margin-bottom:14px;}

  /* chevron 阶段流 */
  .chev-chain{display:flex;align-items:stretch;overflow-x:auto;padding:2px 0;}
  .chev{flex:1;min-width:128px;color:#fff;padding:12px 20px 12px 18px;position:relative;
    clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 16px 50%);}
  .chev:first-child{clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);}
  .chev:not(:first-child){margin-left:-12px;}
  .chev-name{font-size:12px;opacity:.95;font-weight:600;margin-bottom:5px;}
  .chev-metrics{display:flex;flex-direction:column;gap:3px;}
  .chev-metrics .m{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .chev-metrics .ml{font-size:10px;opacity:.82;}
  .chev-metrics .mv{font-size:17px;font-weight:700;letter-spacing:-.3px;}
  .chev-metrics .m.stay{border-top:1px solid rgba(255,255,255,.25);padding-top:3px;}
  .chev-metrics .m.stay .mv{font-size:13px;font-weight:600;opacity:.92;}
  .chev-sub{font-size:10px;opacity:.8;margin-top:5px;}

  /* skill pills 乱序调用 */
  .pill-row{display:flex;flex-wrap:wrap;gap:10px;}
  .skill-pill{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-left-width:4px;
    border-radius:var(--radius-md);padding:10px 14px;min-width:150px;background:#fff;}
  .skill-pill .pill-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .skill-pill .sp-name{font-size:12px;color:var(--secondary);font-weight:600;}
  .skill-pill .sp-metrics{display:flex;gap:14px;margin:3px 0 1px;}
  .skill-pill .sp-metrics .m{display:flex;flex-direction:column;line-height:1.25;}
  .skill-pill .sp-metrics .m.err{padding-left:12px;border-left:1px solid var(--border);}
  .skill-pill .sp-metrics .ml{font-size:10px;color:var(--muted);}
  .skill-pill .sp-metrics .mv{font-size:16px;font-weight:700;color:var(--foreground);letter-spacing:-.2px;}
  .skill-pill .sp-metrics .m.stay .mv{font-size:14px;color:var(--secondary);}
  .skill-pill .sp-metrics .m.err .mv{font-size:14px;}
  .skill-pill .sp-metrics .m.err.ok .mv{color:var(--success);}
  .skill-pill .sp-metrics .m.err.warn .mv{color:#DC6803;}
  .skill-pill .sp-metrics .m.err.bad .mv{color:var(--danger);}
  .skill-pill .sp-sub{font-size:10px;color:var(--muted);}

  .flow-tag{display:inline-block;font-size:11px;color:var(--secondary);margin-top:12px;background:#F7F9FB;
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;line-height:1.5;}
  .flow-tag b{color:var(--foreground);}

  /* ---------- 大表格 ---------- */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);}
  table.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:720px;}
  .tbl th,.tbl td{padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  .tbl thead th{background:var(--th-fill);color:var(--secondary);font-weight:600;font-size:14px;
    border-bottom:2px solid var(--border-strong);position:sticky;top:0;z-index:2;}
  .tbl thead th .caret{color:var(--muted);font-size:10px;margin-left:4px;}
  .tbl th.sticky,.tbl td.sticky{position:sticky;left:0;text-align:left;background:#fff;z-index:1;box-shadow:1px 0 0 var(--border);}
  .tbl thead th.sticky{z-index:3;background:var(--th-fill);}
  .tbl tbody tr:hover td{background:#FAFBFC;}
  .tbl tbody tr:hover td.sticky{background:#FAFBFC;}
  .rowhead{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--foreground);font-size:14px;}
  .rowhead .chv{color:var(--muted);font-size:12px;}
  .cv{font-weight:600;color:var(--foreground);font-size:14px;}
  .cd{font-size:12px;margin-top:1px;font-weight:600;display:flex;gap:2px;justify-content:flex-end;}
  .tag{display:inline-block;background:var(--brand-tint);color:var(--brand-deep);border-radius:var(--radius-sm);padding:2px 10px;font-size:12px;font-weight:600;}
  .pagi{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:14px;font-size:13px;color:var(--secondary);}
  .pagi button{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;font-family:inherit;color:var(--secondary);}
  .pagi button.on{background:var(--brand-tint);color:var(--brand-deep);border-color:var(--brand-tint);font-weight:600;}
  .arch-tabs{display:inline-flex;gap:4px;}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="logo"></div>
    <div class="ri">◎</div><div class="ri">▤</div><div class="ri on">◈</div><div class="ri">✦</div><div class="ri">⚙</div>
  </nav>
  <div class="main">
    <div class="topnav">
      <div class="nav-item">洞察</div>
      <div class="nav-item">知识</div>
      <div class="nav-item">入口与渠道</div>
      <div class="nav-item on">诊断与服务</div>
      <div class="nav-item">评价与沟通</div>
      <div class="grow"></div>
      <span class="tag">douyin_shorts_community</span>
    </div>

    <div class="page">
      <div class="page-title"><span class="bot">🤖</span>数据监控</div>

      <!-- 核心业务 + 产品指标（全局口径，不分架构） -->
      <div class="card">
        <div class="sec-head"><div class="sec-title"><span class="bar"></span>核心业务与产品指标<span class="sec-sub">全局口径 · 不分架构</span></div></div>
        <div class="group-label">业务指标</div>
        <div class="kpi-grid" id="bizGrid"></div>
        <div class="group-label" style="margin-top:18px;">产品指标</div>
        <div class="kpi-grid four" id="prodGrid"></div>
      </div>

      <!-- 趋势（全局） -->
      <div class="card">
        <div class="sec-head"><div class="sec-title"><span class="bar"></span>核心指标趋势<span class="sec-sub">全局口径</span></div></div>
        <div class="trend" id="trend"></div>
        <div class="trend-legend"><span class="sw"></span>工单解决率　<span style="color:var(--muted)">周期 2026-06-18 ~ 06-22</span></div>
      </div>

      <!-- 执行数据：分流（两架构同时展示） -->
      <div class="card">
        <div class="sec-head"><div class="sec-title"><span class="bar"></span>执行数据<span class="sec-sub">总工单量按架构分流 · 两条支路各自的执行流程</span></div></div>
        <div class="split-total">
          <div class="tnode" id="totalNode"></div>
          <svg class="split-connector" id="connector" viewBox="0 0 800 34" preserveAspectRatio="none"></svg>
        </div>
        <div class="split-lanes" id="lanes"></div>
      </div>

      <!-- 工单标签 / 智能体（技能）分析：按架构切换 -->
      <div class="card">
        <div class="sec-head">
          <div class="sec-title"><span class="bar"></span><span id="tblTitle">工单标签 运营指标分析</span></div>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:12px;color:var(--muted);">按架构查看</span>
            <div class="seg arch-tabs" id="archTabs"></div>
            <div class="seg" id="viewSeg"></div>
          </div>
        </div>
        <div id="bigTable"></div>
        <div class="pagi"><button>Previous</button><button class="on">1</button><button>2</button><button>3</button><button>Next</button></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 全局指标（不分架构） ================= */
const BUSINESS=[
  {l:"工单解决率",v:"17.35%",d:"0.69pp",t:"up",pct:17.35},
  {l:"工单满意度",v:"19.12%",d:"1.22pp",t:"down",pct:19.12},
];
const PRODUCT=[
  {l:"总工单量",v:"2.94万",d:"2.1%",t:"up"},
  {l:"自动化处理率",v:"88.6%",d:"3.4pp",t:"up"},
  {l:"平均首响(s)",v:"4.2",d:"6%",t:"down"},
  {l:"平均完结时长(h)",v:"3.1",d:"9%",t:"down"},
];
const TREND={dates:["06-18","06-19","06-20","06-21","06-22"],values:[15.2,22.8,13.4,26.1,17.35],min:12,max:29};

/* ================= 执行数据：分流 ================= */
const SPLIT={
  total:{label:"总工单量",value:"2.94万",sub:"周期 2026-06 · 进入执行的全部工单"},
  lanes:[
    {
      key:"multiagent", cls:"a", name:"多智能体架构", color:"var(--arch-a)",
      share:"1.71万", pct:"58.2%",
      desc:"Planner + 有序 Subagent，规划 → 研判 → 执行 → 沟通 逐阶段流转",
      flow:"chevron",
      stages:[
        {name:"规划",cum:"1.71万",stay:"312",sub:"进入 100%",color:"var(--s1)"},
        {name:"研判",cum:"1.68万",stay:"1,205",sub:"转化 98.2%",color:"var(--s2)"},
        {name:"执行",cum:"1.60万",stay:"2,480",sub:"转化 95.2%",color:"var(--s3)"},
        {name:"沟通",cum:"4,266",stay:"869",sub:"触发 26.6%",color:"var(--s6)"},
      ],
      note:"累积数=历史流经该阶段的总量；停留数=当前仍停留在该阶段、尚未流转的工单量。",
    },
    {
      key:"agent_skill", cls:"b", name:"Agent + Skill 架构", color:"var(--arch-b)",
      share:"1.23万", pct:"41.8%",
      desc:"Planner 依任务按需 / 乱序调度技能，无固定阶段",
      flow:"pills",
      skills:[
        {name:"流量诊断",cum:"5,530",stay:"210",err:"0.87%",errN:48,sub:"占比 45.0%",color:"#3E8EF7"},
        {name:"审核催审",cum:"3,360",stay:"142",err:"0.41%",errN:14,sub:"占比 27.3%",color:"#5AA0FF"},
        {name:"处罚申诉",cum:"2,130",stay:"96",err:"1.79%",errN:38,sub:"占比 17.3%",color:"#7FB6FF"},
        {name:"违规预警",cum:"780",stay:"38",err:"0.76%",errN:6,sub:"占比 6.3%",color:"#A7CDFF"},
        {name:"月度报告",cum:"340",stay:"12",err:"2.94%",errN:10,sub:"占比 2.8%",color:"#2B6FD6"},
        {name:"博主对标",cum:"160",stay:"5",err:"5.00%",errN:8,sub:"占比 1.3%",color:"#1E4E9E"},
      ],
      note:"三项口径同以「激活片段」为基座：累积数=历史激活片段数（同一 skill 连续执行的工具序列合并为 1 次，离开再回来计新的一次）；停留数=当前正在执行、尚未返回的激活片段；异常率=异常激活片段数 / 累积数（片段内存在未被重试恢复的技术异常即计异常，仅反映技术可靠性，不含业务效果）。注：仅注入 SOP 上下文、未执行任何工具的 skill 无法被观测，异常率为执行口径下的下界。",
    },
  ],
};

/* ================= 工单标签 / 分析表（按架构切换） ================= */
const TABLES={
  multiagent:{
    viewSeg:[{id:"label",label:"工单标签分析"},{id:"agent",label:"智能体分析"}],
    label:{
      title:"工单标签 运营指标分析",
      columns:["工单标签","首次规划量","研判量","执行量","沟通量","首次规划覆盖率","人工介入率","工单解决率","完结时长(h)"],
      rows:[
        ["审核与处罚",{v:"1.20万",d:"3.16%",t:"down"},{v:"1.20万",d:"3.1%",t:"down"},{v:"1.20万",d:"3.04%",t:"down"},{v:"2,038",d:"7.98%",t:"up"},{v:"93.66%",d:"3.83pp",t:"up"},{v:"32.69%",d:"0.03pp",t:"down"},{v:"16%",d:"0.5pp",t:"up"},{v:"3.67",d:"43.1%",t:"down"}],

/* ================= 渲染 ================= */
const icon=t=>t==="up"?"↑":t==="down"?"↓":"–";
let activeArch="multiagent";
let tableView="label";

function kpiCard(m,withProg){
  return `<div class="kpi">
    <div class="kl">${m.l}</div>
    <div class="kv"><b>${m.v}</b><span class="kd ${m.t}">${icon(m.t)} ${m.d}</span></div>
    ${withProg?`<div class="prog"><i style="width:${Math.min(100,m.pct*3.2)}%"></i></div>`:""}
  </div>`;
}
function renderKpi(){
  document.getElementById("bizGrid").innerHTML=BUSINESS.map(m=>kpiCard(m,true)).join("");
  document.getElementById("prodGrid").innerHTML=PRODUCT.map(m=>kpiCard(m,false)).join("");
}

function renderTrend(){
  const W=960,H=240,L=52,R=20,T=16,B=34;
  const px0=L,px1=W-R,py0=T,py1=H-B;
  const {dates,values,min,max}=TREND;
  const xFor=i=>px0+(i/(values.length-1))*(px1-px0);
  const yFor=v=>py1-((v-min)/(max-min))*(py1-py0);
  const pts=values.map((v,i)=>[xFor(i),yFor(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pts[0][0].toFixed(1)} ${py1} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${pts[pts.length-1][0].toFixed(1)} ${py1} Z`;
  const yticks=[12,16,20,24,29];
  const grid=yticks.map(v=>`<line x1="${px0}" y1="${yFor(v).toFixed(1)}" x2="${px1}" y2="${yFor(v).toFixed(1)}" stroke="#EEF1F4"></line>
    <text x="${px0-8}" y="${(yFor(v)+4).toFixed(1)}" text-anchor="end" fill="rgba(28,28,35,.45)" font-size="11">${v}%</text>`).join("");
  const xlab=dates.map((d,i)=>`<text x="${xFor(i).toFixed(1)}" y="${H-12}" text-anchor="middle" fill="rgba(28,28,35,.45)" font-size="11">${d}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="var(--brand)" stroke-width="2"></circle>
    <text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" text-anchor="middle" fill="var(--brand-deep)" font-size="11" font-weight="600">${values[i]}%</text>`).join("");
  document.getElementById("trend").innerHTML=`<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(36,205,165,.28)"></stop><stop offset="1" stop-color="rgba(36,205,165,0)"></stop>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ga)"></path>
    <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.5"></path>
    ${dots}${xlab}
  </svg>`;
}

function renderSplit(){
  const t=SPLIT.total;
  document.getElementById("totalNode").innerHTML=
    `<div class="tl">${t.label}</div><div class="tv">${t.value}</div><div class="ts">${t.sub}</div>`;
  /* 连接线：从顶部中间分流到左右两条支路 */
  document.getElementById("connector").innerHTML=`
    <path d="M400 0 L400 12 Q400 20 392 20 L188 20 Q180 20 180 28 L180 34" fill="none" stroke="var(--arch-a)" stroke-width="2"/>
    <path d="M400 0 L400 12 Q400 20 408 20 L612 20 Q620 20 620 28 L620 34" fill="none" stroke="var(--arch-b)" stroke-width="2"/>
    <circle cx="180" cy="34" r="3" fill="var(--arch-a)"/>
    <circle cx="620" cy="34" r="3" fill="var(--arch-b)"/>`;

  document.getElementById("lanes").innerHTML=SPLIT.lanes.map(L=>{
    let flow;
    if(L.flow==="chevron"){
      flow=`<div class="chev-chain">${L.stages.map(s=>`
        <div class="chev" style="background:${s.color}">
          <div class="chev-name">${s.name}</div>
          <div class="chev-metrics">
            <div class="m"><span class="ml">累积数</span><span class="mv">${s.cum}</span></div>
            <div class="m stay"><span class="ml">停留数</span><span class="mv">${s.stay}</span></div>
          </div>
          <div class="chev-sub">${s.sub}</div>
        </div>`).join("")}</div>`;
    }else{
      flow=`<div class="pill-row">${L.skills.map(s=>{
        const ev=parseFloat(s.err);
        const sev=ev>=3?"bad":ev>=1?"warn":"ok";
        return `
        <div class="skill-pill" style="border-left-color:${s.color}">
          <span class="pill-dot" style="background:${s.color}"></span>
          <div>
            <div class="sp-name">${s.name}</div>
            <div class="sp-metrics">
              <div class="m"><span class="ml">累积数</span><span class="mv">${s.cum}</span></div>
              <div class="m stay"><span class="ml">停留数</span><span class="mv">${s.stay}</span></div>
              <div class="m err ${sev}"><span class="ml">异常率</span><span class="mv">${s.err}</span></div>
            </div>
            <div class="sp-sub">${s.sub} · 异常 ${s.errN} 次</div>
          </div>
        </div>`;}).join("")}</div>`;
    }
    return `<div class="lane ${L.cls}">
      <div class="lane-head">
        <div class="lane-name"><span class="dot"></span>${L.name}</div>
        <div class="lane-share"><b>${L.share}</b><span class="lane-pct">${L.pct}</span></div>
      </div>
      <div class="lane-desc">${L.desc}</div>
      ${flow}
      <div class="flow-tag"><b>${L.flow==="chevron"?"阶段流水线":"按需调用"}</b>：${L.note}</div>
    </div>`;
  }).join("");
}

function renderArchTabs(){
  const tabs=[{k:"multiagent",n:"多智能体架构"},{k:"agent_skill",n:"Agent + Skill 架构"}];
  document.getElementById("archTabs").innerHTML=tabs.map(t=>
    `<button data-arch="${t.k}" class="${t.k===activeArch?'on':''}">${t.n}</button>`).join("");
  document.querySelectorAll("#archTabs button").forEach(b=>b.onclick=()=>{
    activeArch=b.dataset.arch;
    if(!TABLES[activeArch][tableView]) tableView="label";
    renderArchTabs();renderViewSeg();renderTable();
  });
}
function renderViewSeg(){
  const seg=TABLES[activeArch].viewSeg;
  document.getElementById("viewSeg").innerHTML=seg.map(s=>
    `<button data-view="${s.id}" class="${s.id===tableView?'on':''}">${s.label}</button>`).join("");
  document.querySelectorAll("#viewSeg button").forEach(b=>b.onclick=()=>{tableView=b.dataset.view;renderViewSeg();renderTable();});
}
function renderTable(){
  const tbl=TABLES[activeArch][tableView];
  document.getElementById("tblTitle").textContent=tbl.title;
  document.getElementById("bigTable").innerHTML=`<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${tbl.columns.map((c,i)=>`<th class="${i===0?'sticky':''}">${c}${i>0?'<span class="caret">▲▼</span>':''}</th>`).join("")}</tr></thead>
    <tbody>${tbl.rows.map(r=>`<tr>${r.map((cell,i)=>{
      if(i===0) return `<th class="sticky"><span class="rowhead"><span class="chv">▸</span>${cell}</span></th>`;
      if(cell.tag) return `<td><span class="tag">${cell.v}</span></td>`;
      if(cell.plain) return `<td><span class="cv">${cell.v}</span></td>`;
      return `<td><div class="cv">${cell.v}</div><div class="cd ${cell.t}">${icon(cell.t)} ${cell.d}</div></td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>`;
}

renderKpi();
renderTrend();
renderSplit();
renderArchTabs();
renderViewSeg();
renderTable();
</script>

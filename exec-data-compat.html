<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执行数据 · 工单分流看板（TF_Base）</title>
<style>
  :root{
    /* TF_Base tokens */
    --page-fill:#F2F4F7; --surface:#FFFFFF; --glass:rgba(255,255,255,0.65);
    --fill:#F9FAFB;
    --foreground:#182230; --secondary:#475467; --muted:#667085; --disabled:#98A2B3;
    --brand:#56D3BC; --brand-deep:#18B49D; --brand-tint:#EAFAF6;
    --border:#E4E7EC; --border-strong:#D0D5DD;
    --success:#3EB346; --warning:#FA8B14; --danger:#F74331;
    --radius-md:8px; --radius-lg:12px; --radius-card:20px; --radius-full:9999px;
    --sh-card:0 30px 50px 0 rgba(0,9,36,0.05);
    /* 架构主色（图表语境） */
    --ma:#4E5BA6; --ma-tint:#EEF0FA;
    --as:#18B49D; --as-tint:#E6F7F3;
    /* 阶段/技能分类色（克制的冷色系） */
    --c1:#4E5BA6; --c2:#2E90FA; --c3:#18B49D; --c4:#F79009; --c5:#9E77ED; --c6:#EE46BC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--page-fill);color:var(--foreground);
    font-family:Inter,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;padding:24px;font-size:14px;
  }
  .wrap{max-width:1360px;margin:0 auto;}

  /* header：不加卡片、不加分割线 */
  header{padding:8px 4px 20px;}
  .kicker{color:var(--brand-deep);font-size:12px;font-weight:600;letter-spacing:.5px;}
  h1{font-size:18px;font-weight:600;margin:6px 0 4px;color:var(--foreground);}
  .meta{color:var(--muted);font-size:12px;}

  /* cards */
  .card{background:var(--glass);border:1px solid var(--surface);border-radius:var(--radius-card);
    padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.03);}
  .card > h2{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .card .hint{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .dot{width:8px;height:8px;border-radius:var(--radius-full);display:inline-block;background:var(--brand);}

  /* ---------- 分流总览（左→右 sankey） ---------- */
  .sankey{margin:4px 0 6px;}
  .sankey svg{width:100%;height:auto;display:block;}
  .split-legend{display:flex;gap:24px;margin-top:8px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--secondary);}
  .legend-item .sq{width:10px;height:10px;border-radius:3px;flex:none;}
  .legend-item b{color:var(--foreground);font-weight:600;}
  .legend-item .lp{color:var(--muted);}

  /* ---------- 下钻：共享 tab + 左右双列 ---------- */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;
    padding:8px 2px;margin-right:24px;cursor:pointer;position:relative;font-family:inherit;}
  .tabs button:hover{color:var(--secondary);}
  .tabs button.on{color:var(--foreground);}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px;}

  /* 维度说明：tab 下单条，取代两侧重复 callout */
  .dim-note{background:var(--fill);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:10px 14px;font-size:12px;color:var(--secondary);margin-bottom:22px;line-height:1.6;}
  .dim-note b{color:var(--brand-deep);font-weight:600;}

  /* 桑基节点可点击 + 筛选提示 */
  .sankey .arch-node{cursor:pointer;transition:opacity .25s;}
  .sankey .arch-node:hover{opacity:.9;}
  .filter-tip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--secondary);margin-bottom:16px;flex-wrap:wrap;}
  .filter-tip .ftag{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-full);padding:3px 10px;font-weight:600;color:var(--foreground);}
  .filter-tip .ftag .sq{width:8px;height:8px;border-radius:2px;flex:none;}
  .reset-arch{border:1px solid var(--border);background:var(--surface);color:var(--foreground);font-size:12px;font-weight:500;padding:3px 12px;border-radius:var(--radius-full);cursor:pointer;font-family:inherit;}
  .reset-arch:hover{background:var(--fill);border-color:var(--border-strong);}

  .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;}
  .col{min-width:0;position:relative;}
  .col:first-child::after{content:"";position:absolute;top:2px;bottom:0;right:-20px;width:1px;background:var(--border);}
  .cols.single{grid-template-columns:1fr;}
  .cols.single .col::after{display:none;}
  .col.full .units{grid-template-columns:repeat(4,1fr);}
  @media(max-width:1080px){
    .cols{grid-template-columns:1fr;row-gap:26px;}
    .col:first-child::after{display:none;}
    .cols:not(.single) .col:first-child{border-bottom:1px solid var(--border);padding-bottom:26px;}
  }
  @media(max-width:720px){.col.full .units{grid-template-columns:repeat(2,1fr);}}
  .col-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .col-head .an{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .col-head .an .sq{width:10px;height:10px;border-radius:3px;flex:none;}
  .badge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:var(--radius-full);}
  .badge.ma{background:var(--ma-tint);color:var(--ma);}
  .badge.as{background:var(--as-tint);color:var(--brand-deep);}
  .col-sub{font-size:12px;color:var(--muted);margin:7px 0 16px;}
  .col-body{}

  /* cumulative units */
  .units{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:520px){.units{grid-template-columns:1fr}}
  .unit{border:1px solid var(--border);border-top:3px solid var(--c1);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;}
  .unit .uh{padding:10px 14px 8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border);}
  .unit .uh .ud{width:8px;height:8px;border-radius:var(--radius-full);flex:none;}
  .unit .ub{padding:6px 14px 10px;}
  .metric{padding:8px 0;border-bottom:1px solid var(--fill);}
  .metric:last-child{border-bottom:0;}
  .metric .ml{font-size:12px;color:var(--muted);}
  .metric .mv{font-size:18px;font-weight:600;letter-spacing:-.2px;margin-top:1px;color:var(--foreground);}
  .metric .md{font-size:12px;font-weight:500;margin-top:1px;}
  .up{color:var(--success);} .down{color:var(--danger);} .flat{color:var(--muted);}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:8px;}
  .frow{display:grid;grid-template-columns:56px 1fr 92px;align-items:center;gap:10px;}
  .frow .fn{font-size:13px;font-weight:500;color:var(--secondary);text-align:right;}
  .frow .ft{height:34px;border-radius:var(--radius-md);background:var(--fill);overflow:hidden;border:1px solid var(--border);}
  .frow .ff{height:100%;display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:600;font-size:14px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .frow .fv{font-size:14px;font-weight:600;text-align:left;}
  .frow .fv small{display:block;font-size:11px;color:var(--muted);font-weight:400;}
  .farrow{text-align:center;color:var(--disabled);font-size:11px;margin:-2px 0;}

  /* distribution */
  .dist{display:flex;flex-direction:column;gap:9px;}
  .disrow{display:grid;grid-template-columns:80px 1fr 108px;align-items:center;gap:10px;}
  .disrow .dn{font-size:13px;font-weight:500;color:var(--secondary);text-align:right;}
  .disrow .dt{height:22px;border-radius:var(--radius-md);background:var(--fill);overflow:hidden;border:1px solid var(--border);}
  .disrow .df{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .disrow .dv{font-size:13px;font-weight:600;text-align:left;}
  .disrow .dv small{color:var(--muted);font-weight:400;margin-left:5px;}

  /* dense table on white surface */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);}
  .tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;}
  .tbl th,.tbl td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  .tbl tbody tr:last-child td{border-bottom:0;}
  .tbl thead th{position:sticky;top:0;background:var(--fill);color:var(--secondary);font-weight:600;font-size:12px;z-index:2;}
  .tbl th.sticky,.tbl td.sticky{position:sticky;left:0;text-align:left;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--border);}
  .tbl thead th.sticky{z-index:3;background:var(--fill);}
  .tbl tbody tr:hover td{background:var(--fill);}
  .rowhead{font-weight:600;color:var(--foreground);font-size:14px;}
  .cv{font-weight:600;color:var(--foreground);font-size:14px;}
  .cd{font-size:12px;margin-top:1px;font-weight:500;}
  .tag{display:inline-block;background:var(--fill);border:1px solid var(--border);border-radius:var(--radius-full);padding:1px 9px;font-size:12px;color:var(--secondary);font-weight:500;}

  /* callout：中性浅底 */
  .callout{background:var(--fill);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:10px 14px;font-size:12px;color:var(--secondary);margin-top:14px;}
  .callout b{color:var(--brand-deep);font-weight:600;}

  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px;line-height:1.7;padding:0 4px;}
</style>
</head>

          ["审核与处罚",{v:"1.24万",d:"4.1%",t:"up"},{v:"5",plain:true},{v:"审核催审",tag:true},{v:"4.2%",d:"0.8pp",t:"down"},{v:"88.5%",d:"2.1pp",t:"up"},{v:"86.2%",d:"1.4pp",t:"up"},{v:"2.3",d:"12%",t:"down"}],

          ["账号",{v:"980",d:"5.6%",t:"down"},{v:"3",plain:true},{v:"处罚申诉",tag:true},{v:"12.4%",d:"2.2pp",t:"up"},{v:"76.1%",d:"1.1pp",t:"down"},{v:"74.8%",d:"0.9pp",t:"down"},{v:"4.5",d:"6%",t:"up"}],

/* ================= 渲染 ================= */
let activeDim="cumulative";
let archFilter=null; /* null=看全部；'multiagent' / 'agent_skill'=只看该架构 */
const icon=t=>t==="up"?"↑":t==="down"?"↓":"–";

function renderSankey(){
  const W=960,H=200,pad=10;
  const sx0=24,sx1=196,tx0=624,tx1=936,xc=(sx1+tx0)/2;
  const sy0=pad,sy1=H-pad,sh=sy1-sy0;
  const b=OVERVIEW.branches;
  const split=+(sy0+sh*b[0].pct/100).toFixed(1);
  const nh=64, c1=60, c2=150;
  const ma={ts:sy0,bs:split,te:c1-nh/2,be:c1+nh/2,color:b[0].color,rib:b[0].rib,label:b[0].label,pct:b[0].pct};
  const as={ts:split,bs:sy1,te:c2-nh/2,be:c2+nh/2,color:b[1].color,rib:b[1].rib,label:b[1].label,pct:b[1].pct};
  const ribbon=o=>`M${sx1},${o.ts} C${xc},${o.ts} ${xc},${o.te} ${tx0},${o.te} L${tx0},${o.be} C${xc},${o.be} ${xc},${o.bs} ${sx1},${o.bs} Z`;
  const flowLabel=o=>{
    const my=((o.ts+o.bs)/2+(o.te+o.be)/2)/2;
    const bw=132,bh=32,bx=xc-bw/2,by=my-bh/2;
    return `<g>
      <rect x="${bx}" y="${by.toFixed(1)}" width="${bw}" height="${bh}" rx="16" fill="#FFFFFF" stroke="${o.color}"></rect>
      <text x="${xc}" y="${(my-2).toFixed(1)}" text-anchor="middle" fill="#182230" font-size="13" font-weight="600">${o.label} 单</text>
      <text x="${xc}" y="${(my+12).toFixed(1)}" text-anchor="middle" fill="#667085" font-size="11" font-weight="500">占比 ${o.pct}%</text>
    </g>`;
  };
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="工单分流" style="font-family:inherit">
    <path d="${ribbon(ma)}" fill="${b[0].rib}"></path>
    <path d="${ribbon(as)}" fill="${b[1].rib}"></path>
    <rect x="${sx0}" y="${sy0}" width="${sx1-sx0}" height="${sh}" rx="12" fill="#FFFFFF" stroke="#E4E7EC"></rect>
    <text x="${(sx0+sx1)/2}" y="90" text-anchor="middle" fill="#667085" font-size="12" font-weight="500">工单总量</text>
    <text x="${(sx0+sx1)/2}" y="118" text-anchor="middle" fill="#182230" font-size="22" font-weight="600">${OVERVIEW.totalLabel}</text>
    ${flowLabel(ma)}
    ${flowLabel(as)}
    <g class="arch-node" data-arch="${b[0].key}">
      <rect x="${tx0}" y="${ma.te}" width="${tx1-tx0}" height="${nh}" rx="12" fill="${archFilter===b[0].key?'#FFFFFF':(b[0].cls==='ma'?'#EEF0FA':'#E6F7F3')}" stroke="${b[0].color}" stroke-width="${archFilter===b[0].key?2.5:1}"></rect>
      <text x="${(tx0+tx1)/2}" y="${c1-6}" text-anchor="middle" fill="#182230" font-size="14" font-weight="600">${b[0].name}</text>
      <text x="${(tx0+tx1)/2}" y="${c1+16}" text-anchor="middle" fill="#475467" font-size="13" font-weight="500">${b[0].label} · ${b[0].pct}%</text>
    </g>
    <g class="arch-node" data-arch="${b[1].key}">
      <rect x="${tx0}" y="${as.te}" width="${tx1-tx0}" height="${nh}" rx="12" fill="${archFilter===b[1].key?'#FFFFFF':'#E6F7F3'}" stroke="${b[1].color}" stroke-width="${archFilter===b[1].key?2.5:1}"></rect>
      <text x="${(tx0+tx1)/2}" y="${c2-6}" text-anchor="middle" fill="#182230" font-size="14" font-weight="600">${b[1].name}</text>
      <text x="${(tx0+tx1)/2}" y="${c2+16}" text-anchor="middle" fill="#475467" font-size="13" font-weight="500">${b[1].label} · ${b[1].pct}%</text>
    </g>
  </svg>`;
  document.getElementById("sankey").innerHTML=svg;
  document.querySelectorAll("#sankey .arch-node").forEach(g=>{
    g.addEventListener("click",()=>{
      const k=g.dataset.arch;
      archFilter=(archFilter===k)?null:k;
      renderSankey();renderDetail();
    });
  });
  document.getElementById("splitLegend").innerHTML=OVERVIEW.branches.map(x=>`
    <div class="legend-item"><span class="sq" style="background:${x.color}"></span>
      <span><b>${x.name}</b> ${x.label}<span class="lp"> · 占比 ${x.pct}% · ${x.desc}</span></span></div>`).join("");
}

function renderCumulative(units){
  return `<div class="units">${units.map(u=>`
    <div class="unit" style="border-top-color:${u.color}">
      <div class="uh"><span class="ud" style="background:${u.color}"></span>${u.name}</div>
      <div class="ub">${u.metrics.map(m=>`
        <div class="metric"><div class="ml">${m.l}</div><div class="mv">${m.v}</div>
        <div class="md ${m.t}">环比 ${icon(m.t)} ${m.d}</div></div>`).join("")}</div>
    </div>`).join("")}</div>`;
}
function renderFunnel(dist){
  const max=Math.max(...dist.map(d=>d.value));
  return `<div class="funnel">${dist.map((d,i)=>`
    ${i>0?'<div class="farrow">↓ 流入下一环</div>':''}
    <div class="frow"><div class="fn">${d.name}</div>
      <div class="ft"><div class="ff" style="width:${Math.max(14,d.value/max*100)}%;background:${d.color}">${d.label}</div></div>
      <div class="fv">${d.label}<small>当前停留</small></div></div>`).join("")}</div>`;
}
function renderDistribution(dist){
  const max=Math.max(...dist.map(d=>d.value));
  return `<div class="dist">${dist.map(d=>`
    <div class="disrow"><div class="dn">${d.name}</div>
      <div class="dt"><div class="df" style="width:${d.value/max*100}%;background:${d.color}"></div></div>
      <div class="dv">${d.label}${d.pct?`<small>${d.pct}</small>`:""}</div></div>`).join("")}</div>`;
}
function renderTable(tbl){
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${tbl.columns.map((c,i)=>`<th class="${i===0?'sticky':''}">${c}</th>`).join("")}</tr></thead>
    <tbody>${tbl.rows.map(r=>`<tr>${r.map((cell,i)=>{
      if(i===0) return `<th class="sticky rowhead">${cell}</th>`;
      if(cell.tag) return `<td><span class="tag">${cell.v}</span></td>`;
      if(cell.plain) return `<td><span class="cv">${cell.v}</span></td>`;
      return `<td><div class="cv">${cell.v}</div><div class="cd ${cell.t}">${icon(cell.t)} ${cell.d}</div></td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderDim(key,dim){
  const cfg=DATA[key];
  if(dim==="cumulative") return renderCumulative(cfg.cumulativeUnits);
  if(dim==="flow") return key==="multiagent"?renderFunnel(cfg.dist):renderDistribution(cfg.dist);
  if(dim==="label") return renderTable(cfg.tables.label);
  if(dim==="unit") return renderTable(cfg.tables.agent);
  return "";
}

/* 维度级说明：一条讲清「这个维度两架构怎么兼容」 */
const DIM_NOTES={
  cumulative:"<b>累计数</b>：执行/介入/异常的次数与率与架构无关，两侧同口径，可直接横向对比；卡片按执行单元（阶段 / 技能）罗列，数量自适应。",
  flow:"<b>停留 · 分布</b>：多智能体是<b>有序漏斗</b>（上一环流入下一环，定位堵点）；Agent+Skill 无流水线顺序，漏斗失去语义 → 换成<b>技能调用分布</b>，看量级与占比。",
  label:"<b>工单标签分析</b>：多智能体保留 首次规划量/研判量/执行量/沟通量 等阶段列；Agent+Skill 无阶段 → 收敛为 调用总量+涉及技能数+Top技能，通用列（介入率/解决率/满意度/时长）一致。",
  unit:"<b>执行单元分析</b>：执行主体从 阶段 Subagent 换成 Skill，行数随任务动态；处理量/成功率/介入率/异常率/耗时/Token 同口径，可横向对比。",
};

function renderDetail(){
  const single=!!archFilter;
  const col=b=>{
    const cfg=DATA[b.key];
    return `<div class="col ${b.cls}${single?' full':''}">
      <div class="col-head">
        <span class="an"><span class="sq" style="background:${b.color}"></span>${b.name}</span>
        <span class="badge ${b.cls}">流入 ${b.label} · ${b.pct}%</span>
      </div>
      <div class="col-sub">${cfg.subtitles[activeDim]}</div>
      <div class="col-body">${renderDim(b.key,activeDim)}</div>
    </div>`;
  };
  const shown = single
    ? OVERVIEW.branches.filter(b=>b.key===archFilter)
    : OVERVIEW.branches;
  const fb = single ? OVERVIEW.branches.find(b=>b.key===archFilter) : null;
  const hint = single
    ? `已聚焦单一架构，独占全宽查看更完整；点顶部节点或右侧「查看全部」可返回对比。`
    : `选择一个维度，左右并排对比两种执行架构的同口径数据；点上方桑基节点可只看单一架构。`;
  const filterTip = single ? `
    <div class="filter-tip">
      <span>当前筛选</span>
      <span class="ftag"><span class="sq" style="background:${fb.color}"></span>${fb.name} · 流入 ${fb.label} · ${fb.pct}%</span>
      <button class="reset-arch" id="resetArch">查看全部 ↺</button>
    </div>` : "";
  document.getElementById("detail").innerHTML=`
    <div class="card">
      <h2><span class="dot"></span>按架构下钻</h2>
      <div class="hint">${hint}</div>
      <div class="tabs">${DIMS.map(d=>`<button data-dim="${d.id}" class="${d.id===activeDim?'on':''}">${d.label}</button>`).join("")}</div>
      <div class="dim-note">💡 ${DIM_NOTES[activeDim]}</div>
      ${filterTip}
      <div class="cols${single?' single':''}">${shown.map(col).join("")}</div>
    </div>`;
  document.querySelectorAll("#detail .tabs button").forEach(btn=>{
    btn.addEventListener("click",()=>{activeDim=btn.dataset.dim;renderDetail();});
  });
  const rb=document.getElementById("resetArch");
  if(rb) rb.addEventListener("click",()=>{archFilter=null;renderSankey();renderDetail();});
}

renderSankey();
renderDetail();
</script>
</body>
